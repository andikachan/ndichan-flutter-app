name: Build Ndichan Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Release Keystore & key.properties
        run: |
          cd android
          keytool -genkey -v -keystore app/ndichan-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ndichan -dname "CN=Ndichan, OU=Mobile, O=Ndichan, L=Jakarta, ST=Jakarta, C=ID" \
            -storepass ndichan123 -keypass ndichan123

          cat << 'EOF' > key.properties
          storePassword=ndichan123
          keyPassword=ndichan123
          keyAlias=ndichan
          storeFile=ndichan-release.jks
          EOF
          cd ..

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Release APKs (Split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/ndichan-universal-v1.0.67.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-output/ndichan-arm64-v8a-v1.0.67.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-output/ndichan-armeabi-v7a-v1.0.67.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-output/ndichan-x86_64-v1.0.67.apk || true
          ls -la release-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ndichan-apk-v1.0.67
          path: release-output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.67
          name: Ndichan Mobile v1.0.67 (100% Identical Replica)
          body: |
            ## Ndichan Mobile v1.0.67 🌌⚡
            
            Aplikasi Android resmi untuk **Ndichan (ndika-nime)** dibangun dengan **Flutter & Dart**, dengan tampilan dan seluruh fitur 100% identik dengan website `ndichan.xyz`.
            
            ### ✨ Fitur Utama:
            - **100% Identik**: Semua halaman (Home, Komik, Explore, Schedule, Ongoing, Watch, Manga Reader, W2G, Gacha 3D, Arena, Marketplace, World Boss Raid, Isekai Map, Colosseum Tournament, Clan, Messages, Profile) sama persis!
            - **Desain AMOLED Dark & Gold Glassmorphism**: Tema `--ink: #0B0B10` & `--gold: #D4A73C`.
            - **Integrasi Hardware Back Button**: Navigasi riwayat web mulus & konfirmasi double-back untuk keluar.
            - **Native Fullscreen Video & Danmaku**: Nonton anime sub Indo tanpa jeda.
            - **Manga Reader Vertikal**: Scroll bab manga tanpa lag.
            - **Signed Release**: Keystore terverifikasi & siap install di semua perangkat Android.
            
            ### 📦 Unduhan APK:
            - `ndichan-universal-v1.0.67.apk`: Kompatibel untuk semua tipe perangkat Android.
            - `ndichan-arm64-v8a-v1.0.67.apk`: Optimal dan hemat penyimpanan untuk HP Android modern (64-bit).
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
